<details id="languages">
    <summary id="profile-lbl">
        <pb-i18n key="form.language">Language(s)</pb-i18n>
    </summary>
    <fx-trigger class="add">
        <pb-popover>
            <iron-icon icon="add-circle-outline"></iron-icon>
            <template slot="alternate">
                <pb-i18n key="form.hint-add-language"></pb-i18n
                ></template>
        </pb-popover>
        <fx-insert
          context="langUsage"
          ref="language"
          origin="instance('templates')/language"></fx-insert>
    </fx-trigger>

    <fx-repeat
      class="nested-repeat"
      ref="langUsage/language[not(note)][@ident!='']"
      id="r-language">
        <template>
            <fx-group>
                <fx-control ref="@ident">
                    <label>
                        <pb-i18n key="form.language">Language</pb-i18n>
                    </label>
                    <select
                      class="widget"
                      ref="instance('vars')/languages[@xml:lang=instance('vars')/language]/lang">
                        <template>
                            <option value="{@code}">{.}</option>
                        </template>
                    </select>
                </fx-control>

                <fx-control ref="@ana">
                    <label>
                        <pb-i18n key="form.languageMain">Hauptsprache</pb-i18n>
                    </label>
                </fx-control>
            </fx-group>
            <fx-trigger>
                <pb-popover>
                    <iron-icon icon="remove-circle-outline"></iron-icon>
                    <template slot="alternate">
                        <pb-i18n key="form.hint-delete-language"></pb-i18n
                        ></template>
                </pb-popover>
                <fx-delete ref="."></fx-delete>
            </fx-trigger>
        </template>
    </fx-repeat>

    <fx-control ref="langUsage/language[@ident='']/note">
        <label>
            <pb-i18n key="form.languageFree"
            >Andere Sprachen oder Kommentare</pb-i18n
            ></label
        >
    </fx-control>
</details>
