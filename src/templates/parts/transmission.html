<details id="transmission" class="group-6">
    <summary>
        <pb-i18n key="form.transmission">Überlieferung</pb-i18n>
        <pb-popover>
            <iron-icon icon="info-outline"></iron-icon>
            <template slot="alternate">
                <pb-i18n key="form.hint-recorded-location"></pb-i18n>
            </template>
        </pb-popover>
    </summary>

    <!-- 12c) Überlieferung -->
    <fieldset>
        <legend>
            <label>
                <pb-i18n key="form.transmission">Überlieferung</pb-i18n>
            </label>
            <fx-trigger class="add" title="Überlieferung hinzufügen">
                <iron-icon
                  icon="add-circle-outline"
                  title="Überlieferung hinzufügen"></iron-icon>
                <fx-insert
                  context="listBibl[@type='transmission']"
                  ref="bibl"
                  origin="instance('templates')//bibl"></fx-insert>
                <fx-refresh control="r-transmission"></fx-refresh>
            </fx-trigger>
        </legend>
        <fx-repeat
          class="nested-repeat"
          id="r-transmission"
          ref="listBibl[@type='transmission']/bibl">
            <template>
                <fx-var
                  name="current"
                  value="count(./preceding-sibling::bibl) + 1"></fx-var>
                <div>
                    <div class="output">
                        <label>
                            <pb-i18n key="form.biblio-abbreviation"
                            >Kürzel</pb-i18n
                            ></label
                        >
                        <div>
                            <fx-trigger>
                                <iron-icon
                                  class="widget"
                                  icon="icons:content-copy"></iron-icon>
                                <fx-call function="clipboard(@corresp)"></fx-call>
                            </fx-trigger>
                        </div>
                        <pb-popover>
                            <iron-icon icon="info-outline"></iron-icon>
                            <template slot="alternate">
                                <pb-i18n key="form.hint-biblio-abbreviation"
                                >XML:ID</pb-i18n
                                >
                            </template>
                        </pb-popover>
                    </div>
                    <fx-control ref="@corresp" update-event="change">
                        <label>
                            <pb-i18n key="form.reference">Referenz</pb-i18n>
                        </label>
                        <jinn-zotero-picker
                          class="widget"
                          group="2519759"></jinn-zotero-picker>
                    </fx-control>
                    <fx-control ref="citedRange">
                        <label>
                            <pb-i18n key="form.cited-range">Cited Range</pb-i18n>
                        </label>
                    </fx-control>

                    <div>
                        <fx-control ref="note" as="node" update-event="leave">
                            <label>
                                <pb-i18n key="form.notes">Anmerkungen</pb-i18n>
                            </label>
                            <edep-xml-editor
                              class="widget"
                              placeholder="[Inline text/markup or sequence of paragraphs]"
                              schema-root="note">
                            </edep-xml-editor>
                        </fx-control>
                    </div>
                </div>
                <fx-trigger>
                    <iron-icon
                      icon="remove-circle-outline"
                      title="Überlieferung löschen"></iron-icon>
                    <fx-delete ref="."></fx-delete>
                    <fx-refresh control="r-transmission"></fx-refresh>
                </fx-trigger>
            </template>
        </fx-repeat>
    </fieldset>
</details>
