<html>
<head>
    <meta charset="utf-8" />
    <title data-template="config:app-title"></title>
    <base href="${app}/" data-template="pages:parse-params" />

    <meta content="width=device-width, minimum-scale=1, initial-scale=1, user-scalable=yes" name="viewport" />
    <link href="resources/images/favicon.ico" rel="shortcut icon" type="image/x-icon" />
    <link href="resources/images/favicon-16.png" rel="shortcut icon" sizes="16x16" type="image/png" />
    <link href="resources/images/favicon-24.png" rel="shortcut icon" sizes="24x24" type="image/png" />
    <link href="resources/images/favicon-32.png" rel="shortcut icon" sizes="32x32" type="image/png" />
    <link href="resources/images/favicon-64.png" rel="shortcut icon" sizes="64x64" type="image/png" />
    <link href="resources/css/theme.css" media="screen" rel="stylesheet" />
    <link href="resources/css/fore.css" media="screen" rel="stylesheet" />
    <link href="resources/css/edep-theme.css" media="screen" rel="stylesheet" />
    <link href="resources/css/edep-theme2.css" media="screen" rel="stylesheet" />
    <link href="resources/css/geo-picker.css" media="screen" rel="stylesheet" />
    <link href="transform/edep.css" media="screen" rel="stylesheet" />
    <link href="resources/css/zotero-autocomplete.css" media="screen" rel="stylesheet" />
    <!-- Uncomment if jinn-codemirror is running on 8000 -->
<!--    <script type="module" src="http://localhost:8000/src/jinn-codemirror-bundle.ts"></script>-->
    <script src="resources/scripts/jinn-codemirror-bundle.js" type="module"></script>

    <!--        <script type="module" src="http://localhost:8090/index.js"></script>-->
    <!--        <script type="module" src="http://localhost:8090/tools/fx-lens.js"></script>-->
    <script src="resources/scripts/fore/fore-dev.js" type="module"></script>
    <script src="resources/scripts/fore/fx-lens.js" type="module"></script>

    <script src="resources/scripts/zotero-autocomplete.js" type="module"></script>
    <script src="resources/scripts/edep-xml-editor.js" type="module"></script>
    <script type="module" src="pb-components-bundle.js" data-template="pages:load-components"></script>
    <style>
        fx-lens {
            top: 4rem;
        }
    </style>
</head>

<body>
<pb-page
    data-template="pages:pb-page"
    locales="resources/i18n/{{ns}}/{{lng}}.json"
    require-language=""
    supported-languages="de,en"
    unresolved="unresolved">
    <app-drawer-layout force-narrow="force-narrow">
        <app-drawer align="right" slot="drawer">
            <div class="drawer-content">
                <pb-media-query query="(max-width: 1023px)">
                    <!-- language selector -->
                    <pb-lang data-template="pages:languages" name="lang"></pb-lang>
                </pb-media-query>
            </div>
        </app-drawer>
        <app-header-layout>
            <app-header effects="waterfall" fixed="fixed" reveals="reveals" slot="header">
                <app-toolbar data-template="lib:include" data-template-path="templates/menu.html"></app-toolbar>
                <pb-media-query query="(max-width: 1023px)">
                    <app-toolbar class="toolbar" sticky="sticky">
                        <!-- Search input -->
                        <pb-search
                            action="${app}/search.html"
                            data-template="lib:parse-params"
                            redirect="redirect"
                            value="${query}"></pb-search>
                        <paper-icon-button drawer-toggle="drawer-toggle" icon="icons:menu"></paper-icon-button>
                    </app-toolbar>
                </pb-media-query>
            </app-header>

            <main class="editor" id="main">
                <fx-fore id="epidoc-editor" show-confirmation="show-confirmation">
                    <fx-model data-template="pages:parse-params">

                        <fx-instance id="default">
                            <data>
                                <example>
                                    content
                                </example>
                            </data>
                        </fx-instance>

                    </fx-model>


                    <fx-control
                        ref="example"
                        as="node"
                        update-event="leave">
                        <label>
                            Fundkontext
                        </label>
                        <edep-xml-editor
                            class="widget"
                            placeholder="[Inline text/markup or sequence of paragraphs]"
                            schema-root="provenance"
                            base-url="${app}"
                            data-template="lib:parse-params">
                        </edep-xml-editor>
                    </fx-control>

                </fx-fore>

                <fx-lens></fx-lens>
            </main>

            <footer class="version">
                App: v<span data-template="pages:version"></span>
            </footer>
        </app-header-layout>
    </app-drawer-layout>
</pb-page>

<!--<script src="./resources/scripts/util.js" type="text/javascript"></script>-->
<!--fx-devtools></fx-devtools-->
</body>
</html>
